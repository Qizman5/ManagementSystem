<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse REST API Documentation - OpenAPI 3.1</title>
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
        :root { --bg-dark: #0b0f19; --card-bg: #151c2c; --border-color: rgba(255, 255, 255, 0.08); --accent-blue: #3b82f6; --accent-purple: #8b5cf6; }
        body { margin: 0; padding: 0; background-color: var(--bg-dark); color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; border: 1px solid var(--border-color); }
        .custom-swagger-header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .custom-swagger-header h1 { font-size: 1.25rem; margin: 0; font-weight: 700; color: #fff; }
        .btn-back { background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%); color: white; padding: 0.5rem 1rem; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.875rem; }
        #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .swagger-ui { filter: invert(88%) hue-rotate(180deg); }
        .swagger-ui img, .swagger-ui .model-box, .swagger-ui .opblock .opblock-summary-method { filter: invert(100%) hue-rotate(180deg); }
        .swagger-ui .topbar { display: none; }
    </style>
</head>
<body>
    <div class="custom-swagger-header">
        <h1><i class="bi bi-code-slash text-info"></i> Warehouse REST API Standards Spec</h1>
        <a href="/Admin/Index" class="btn-back"><i class="bi bi-arrow-left"></i> Назад в Адмінку</a>
    </div>
    <div id="swagger-ui"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-standalone-preset.min.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "/swagger/v1/swagger.json",
                dom_id: "#swagger-ui",
                deepLinking: true,
                presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
                plugins: [SwaggerUIBundle.plugins.DownloadUrl],
                layout: "BaseLayout",
                persistAuthorization: true,
                displayRequestDuration: true,
                filter: true,
                docExpansion: "list"
            });
        };
    </script>
</body>
</html>
