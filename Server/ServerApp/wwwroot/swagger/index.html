<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse REST API Documentation - OpenAPI 3.1</title>
    
    <!-- Swagger UI CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2c;
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* Кастомний скролбар */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* Шапка Swagger */
        .custom-swagger-header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .custom-swagger-header h1 {
            font-size: 1.25rem;
            margin: 0;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-back {
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-purple) 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            transition: opacity 0.2s;
        }
        .btn-back:hover {
            opacity: 0.9;
            color: white;
        }

        /* Кастомізація Swagger UI під Dark Mode */
        #swagger-ui {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .swagger-ui {
            filter: invert(88%) hue-rotate(180deg);
        }

        .swagger-ui img, 
        .swagger-ui .model-box,
        .swagger-ui .opblock .opblock-summary-method {
            filter: invert(100%) hue-rotate(180deg);
        }

        .swagger-ui .topbar {
            display: none; /* Ховаємо стандартну шапку Swagger */
        }

        /* Адаптивність */
        @media (max-width: 576px) {
            .custom-swagger-header {
                padding: 1rem;
            }
            #swagger-ui {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Кастомний капелюх у стилі системи -->
    <div class="custom-swagger-header">
        <h1>
            <i class="bi bi-code-slash text-info"></i> Warehouse REST API Standards Spec
        </h1>
        <a href="/Admin/Index" class="btn-back">
            <i class="bi bi-arrow-left"></i> Назад в Адмінку
        </a>
    </div>

    <!-- Контейнер Swagger -->
    <div id="swagger-ui"></div>

    <!-- Swagger UI JS Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-standalone-preset.min.js"></script>

    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: "/swagger/v1/swagger.json",
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "BaseLayout",
                persistAuthorization: true, // Зберігає JWT-токен при перезавантаженні сторінки
                displayRequestDuration: true, // Показує час виконання запиту
                filter: true, // Додає поле фільтрації/пошуку ендпоінтів
                docExpansion: "list", // "list", "full" або "none"
                defaultModelsExpandDepth: 1
            });
            window.ui = ui;
        };
    </script>
</body>
</html>
