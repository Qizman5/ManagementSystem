name: .NET Build Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 1. Встановлюємо MAUI workloads для збірки клієнта
    - name: Install MAUI Workload
      run: dotnet workload install maui

    # 2. Відновлюємо залежності рішення
    - name: Restore dependencies
      run: dotnet restore WarehouseManagementSystem.sln

    # 3. Збірка Сервера (Backend)
    - name: Build Server
      run: dotnet build Server/ServerApp/ServerApp.csproj --no-restore --configuration Release

    # 4. Збірка Клієнта (MAUI Windows/Android)
    - name: Build Client (MAUI)
      run: dotnet build Client/ClientApp/ClientApp.csproj --no-restore --configuration Release -f net8.0-windows10.0.19041.0
      